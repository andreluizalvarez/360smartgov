# Blueprint do Render — https://render.com/docs/blueprint-spec
# Conecte este repositorio em https://dashboard.render.com/blueprints
# Cada push no branch master dispara um novo deploy automaticamente.
services:
  - type: web
    name: smartgov360
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"

      # Classificacao por IA (obrigatoria para /api/classify e /api/classify-image).
      # sync: false = o valor NAO fica no repositorio; cadastre no painel do Render.
      - key: OPENAI_API_KEY
        sync: false

      # Notificacoes por e-mail. Use gmail OU resend.
      - key: EMAIL_PROVIDER
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # WhatsApp (opcional).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
